<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaze Clone - Double</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-layout">
    <aside class="sidebar">
        <div class="sidebar-header">BLAZE CLONE</div>
        
        <div class="bet-container">
            <label>Quantia</label>
            <div class="input-area">
                <input type="number" id="betAmount" value="1.00">
                <button onclick="adjustBet(0.5)">½</button>
                <button onclick="adjustBet(2)">2x</button>
            </div>
            
            <button class="btn-spin" id="spinBtn" onclick="spin()">Começar o jogo</button>
        </div>

        <div class="balance-box">
            Saldo: R$ <span id="saldo">1000.00</span>
        </div>
    </aside>

    <main class="game-area">
        <div class="display-roleta">
            <div class="pointer"></div>
            <div class="wheel-container">
                <img src="https://i.postimg.cc/qM9387n0/blaze-wheel.png" id="wheel" class="wheel-img">
            </div>
        </div>

        <div class="bet-selector">
            <button class="bet-btn red" onclick="selectBet('red')">2x</button>
            <button class="bet-btn white" onclick="selectBet('white')">14x</button>
            <button class="bet-btn black" onclick="selectBet('black')">2x</button>
        </div>

        <div id="status-text">ESCOLHA UMA COR</div>

        <div class="history" id="history"></div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
